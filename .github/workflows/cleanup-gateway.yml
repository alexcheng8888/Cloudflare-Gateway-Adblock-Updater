name: Cloudflare Gateway Cleanup

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4      # 👈 改為 v4
        with:
          ref: main                    # 👈 改為 main

      - name: Set up Python
        uses: actions/setup-python@v5  # 👈 改為 v5
        with:
          python-version: '3.12'       # 👈 改為 3.12

      - name: Cache pip packages
        uses: actions/cache@v4         # 👈 改為 v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-requests-aiohttp
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp

      - name: Run cleanup script
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python cleanup_gateway.py
