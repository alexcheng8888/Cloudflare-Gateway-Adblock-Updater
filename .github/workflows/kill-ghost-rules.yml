name: Kill Ghost Rules

on:
  workflow_dispatch:

jobs:
  kill-ghosts:
    runs-on: ubuntu-latest
    steps:
      - name: Force Delete All Gateway Rules via API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Fetching rules..."
          # 获取所有规则
          RULES_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/gateway/rules" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json")
          
          echo "=== CURRENT RULES ==="
          echo "$RULES_JSON" | python -m json.tool
          echo "====================="
          
          # 提取所有规则的 ID
          RULE_IDS=$(echo "$RULES_JSON" | python -c "import sys, json; print(' '.join([r['id'] for r in json.load(sys.stdin)['result']]))")
          
          if [ -z "$RULE_IDS" ]; then
            echo "No rules found. You are clean!"
          else
            for ID in $RULE_IDS; do
              echo "Deleting rule ID: $ID ..."
              curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/gateway/rules/${ID}" \
                -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json"
              echo ""
            done
            echo "All rules deleted!"
          fi
